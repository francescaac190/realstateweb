services:
  # ─────────────────────────────────────────────────────────
  # Backend API (Express + Prisma)
  # ─────────────────────────────────────────────────────────
  - type: web
    name: c21-backend
    runtime: node
    plan: starter
    region: oregon
    branch: master
    rootDir: c21-backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: c21-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: UPLOADS_DIR
        value: /var/data/uploads
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1

  # ─────────────────────────────────────────────────────────
  # Frontend web (descomentar y ajustar cuando exista apps/web)
  # ─────────────────────────────────────────────────────────
  # - type: web
  #   name: c21-web
  #   runtime: static
  #   branch: master
  #   rootDir: apps/web
  #   buildCommand: npm install && npm run build
  #   staticPublishPath: ./dist
  #   autoDeploy: true
  #   envVars:
  #     - key: VITE_API_URL
  #       value: https://c21-backend.onrender.com
  #   routes:
  #     - type: rewrite
  #       source: /*
  #       destination: /index.html

# Mobile (apps/mobile): NO va en Render. Deploy via EAS Build → TestFlight / Play Store.

databases:
  - name: c21-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
